name: Bug report
description: Something in Nitpick does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Nitpick version and macOS version
      placeholder: "Nitpick 0.1.0, macOS 15.5"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, starting from a fresh launch if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Permissions state, provider in use, logs. Never paste API keys.
