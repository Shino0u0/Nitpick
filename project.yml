name: Nitpick
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.9.1
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: true
    DEAD_CODE_STRIPPING: true
targets:
  Nitpick:
    type: application
    platform: macOS
    sources:
      - Nitpick
    dependencies:
      - package: FluidAudio
    entitlements:
      path: Nitpick/Resources/Nitpick.entitlements
      properties:
        com.apple.security.device.audio-input: true
    info:
      path: Nitpick/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nitpick
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Nitpick records audio only while you dictate or ask, and transcribes it on this Mac.
        NSHumanReadableCopyright: "Copyright Nitpick contributors. GPLv3."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shino0u0.Nitpick
        ENABLE_HARDENED_RUNTIME: true
  NitpickTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NitpickTests
    dependencies:
      - target: Nitpick
  NitpickUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - NitpickUITests
    dependencies:
      - target: Nitpick
schemes:
  Nitpick:
    build:
      targets:
        Nitpick: all
    test:
      gatherCoverageData: true
      targets:
        - NitpickTests
        - NitpickUITests
