name: Vortext
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.5
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: true
    DEAD_CODE_STRIPPING: true
targets:
  Vortext:
    type: application
    platform: macOS
    productName: Vortext
    sources:
      - Vortext
    dependencies:
      - package: FluidAudio
    entitlements:
      path: Vortext/Resources/Vortext.entitlements
      properties:
        com.apple.security.device.audio-input: true
    info:
      path: Vortext/Resources/Info.plist
      properties:
        CFBundleDisplayName: Vortext
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Vortext records audio only while you dictate or ask, and transcribes it on this Mac.
        NSHumanReadableCopyright: "Copyright Vortext contributors. GPLv3."
    settings:
      base:
        # Keychain items and TCC permission grants are keyed to this id;
        # renaming it resets permissions and orphans stored keys.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shino0u0.Vortext
        PRODUCT_NAME: Vortext
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VortextTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - VortextTests
    dependencies:
      - target: Vortext
  VortextUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - VortextUITests
    dependencies:
      - target: Vortext
schemes:
  Vortext:
    build:
      targets:
        Vortext: all
    test:
      gatherCoverageData: true
      targets:
        - VortextTests
        - VortextUITests
